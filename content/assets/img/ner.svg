       id="text1"
       transform="matrix(1.0000075,0,0,1.0000075,-380.42885,-388.57468)"><tspan x="382.51678" y="421.07697" id="line1">Die  <tspan id="e-org1">Justus-Liebig-Universität <tspan style="font-weight:bold;-inkscape-font-specification:'Open Sans Bold'"> ORG</tspan></tspan>  in  <tspan id="e-ort">Gießen<tspan style="font-weight:bold;-inkscape-font-specification:'Open Sans Bold'"> ORT</tspan></tspan>  wurde  <tspan id="e-jahr">1607 <tspan style="font-weight:bold;-inkscape-font-specification:'Open Sans Bold'"> JAHR</tspan></tspan>  gegründet. Damals hieß </tspan><tspan x="382.51678" y="469.07697" id="line2">sie  <tspan id="e-org2">Ludiviciana <tspan style="font-weight:bold;-inkscape-font-specification:'Open Sans Bold'"> ORG</tspan></tspan>, benannt nach ihrem Gründer  <tspan id="e-per">Ludwig V. von Hessen-Darmstadt <tspan style="font-weight:bold;-inkscape-font-specification:'Open Sans Bold'"> PER</tspan></tspan>.</tspan></text></g></svg>
